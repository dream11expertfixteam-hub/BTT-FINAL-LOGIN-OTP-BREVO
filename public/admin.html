<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEST TRADERS TEAM Admin</title><style>body{font-family:Arial;background:#070707;color:#fff;margin:0;padding:25px;max-width:1100px;margin-inline:auto}h1,h2{color:#f4c400}.box{background:#111;border:1px solid #292929;border-radius:14px;padding:20px;margin:15px 0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}input,button{padding:11px;border-radius:8px;border:1px solid #444;background:#080808;color:#fff}button{background:#f4c400;color:#111;font-weight:700;cursor:pointer}.secondary{background:#222;color:#fff}.item{border-top:1px solid #333;padding:12px 0;line-height:1.6}.ok{color:#69d27a}.pending{color:#f4c400}.bad{color:#ff7777}</style></head><body><h1>BEST TRADERS TEAM — Admin Panel</h1><button class="secondary" onclick="logout()">Logout</button><div class="box"><h2>Publish Trading Call</h2><div class="row"><input id="market" placeholder="Market"><input id="type" placeholder="Type"><input id="entry" placeholder="Entry"><input id="status" placeholder="Status" value="Published"></div><button onclick="addCall()">Publish Call</button></div><div class="box"><h2>Payment Requests</h2><div id="payments">Loading…</div></div><div class="box"><h2>Members</h2><div id="users">Loading…</div></div><div class="box"><h2>Calls</h2><div id="calls">Loading…</div></div><script>
async function j(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function guard(){const d=await j('/api/me');if(!d.user||d.user.role!=='admin'){document.body.innerHTML='<h2>Admin login required</h2><p>Go back to the main website and login with the admin credentials.</p>';return false}return true}
async function load(){if(!await guard())return;try{const [p,u,c]=await Promise.all([j('/api/admin/payments'),j('/api/admin/users'),j('/api/calls')]);document.getElementById('payments').innerHTML=p.length?p.map(x=>`<div class="item"><b>#${x.id}</b> — ${esc(x.name)} — ${esc(x.email)} — ₹${x.amount} — <span class="${x.status==='pending'?'pending':x.status==='approved'?'ok':'bad'}">${esc(x.status)}</span> ${x.status==='pending'?`<button onclick="approve(${x.id})">Approve</button> <button class="secondary" onclick="reject(${x.id})">Reject</button>`:''}</div>`).join(''):'No payment requests.';document.getElementById('users').innerHTML=u.map(x=>`<div class="item"><b>${esc(x.name)}</b> — ${esc(x.email)} — ${esc(x.role)} — Premium: ${esc(x.premium_until||'None')} <button onclick="premium(${x.id})">Set Premium</button></div>`).join('')||'No members yet.';document.getElementById('calls').innerHTML=c.map(x=>`<div class="item"><b>${esc(x.market)}</b> — ${esc(x.type)} — Entry: ${esc(x.entry)} — ${esc(x.status)} <button class="secondary" onclick="delCall(${x.id})">Delete</button></div>`).join('')||'No calls yet.'}catch(e){alert(e.message)}}
async function addCall(){await j('/api/calls',{method:'POST',body:JSON.stringify({market:market.value,type:type.value,entry:entry.value,status:status.value})});load()}
async function delCall(id){await j('/api/calls/'+id,{method:'DELETE'});load()}
async function approve(id){await j('/api/admin/payments/'+id+'/approve',{method:'POST'});load()}
async function reject(id){await j('/api/admin/payments/'+id+'/reject',{method:'POST'});load()}
async function premium(id){const until=prompt('Premium expiry (YYYY-MM-DD):');if(until)await j('/api/admin/users/'+id+'/premium',{method:'POST',body:JSON.stringify({premium_until:until})});load()}
async function logout(){await j('/api/logout',{method:'POST'});location.href='/'}
load();</script></body></html>
